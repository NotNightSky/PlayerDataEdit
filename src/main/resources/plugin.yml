name: PlayerDataEdit
version: '${version}'

main: com.Nightsky.playerDataEdit.PlayerDataEdit
api-version: '1.13'

authors: [NotNightSky]
website: skyisa.dev

depend: [NBTAPI]

commands:
    recheckdirectory:
        description: Rechecks the player data (NBT) directory and updates it if stale.
        usage: /recheckdirectory
        permission: playerdataedit.recheckNBTDirectory
    playerdataedit:
        description: Opens the player data edit menu, optionally for a specific player.
        usage: /playerdataedit [playername]
        aliases:
            - pde
        permission: playerdataedit.menu

permissions:
    playerdataedit.recheckNBTDirectory:
        description: Allows the player to use the /recheckdirectory command.
        default: op
    playerdataedit.menu:
        description: Allows the player to access the main menu.
        default: op
